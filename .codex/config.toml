default_permissions = "dowin-project"

[features]
hooks = true

[permissions.dowin-project]
extends = ":workspace"

[permissions.dowin-project.filesystem]
":minimal" = "read"
glob_scan_max_depth = 4

[permissions.dowin-project.filesystem.":workspace_roots"]
"." = "write"

# Secret-bearing env files must stay unreadable even inside the writable workspace.
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.env" = "deny"
".dev.vars" = "deny"
".dev.vars.*" = "deny"
"**/.dev.vars" = "deny"
"**/.dev.vars.*" = "deny"

# Tracked templates are intentionally safe to inspect.
".env.example" = "read"
".dev.vars.example" = "read"
